name: Build Android Release APK & Publish Update

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'App.tsx'
      - 'app.json'
      - 'package.json'
      - 'assets/**'
  workflow_dispatch:

jobs:
  build-and-release:
    name: Build APK and Auto Update Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Node Dependencies
        run: npm ci

      - name: Create Production Build Environment File
        run: |
          cat << 'EOF' > .env
          EXPO_PUBLIC_ENV=prod
          EXPO_PUBLIC_API_BASE_URL=https://makemyfree.duckdns.org/api
          EXPO_PUBLIC_SIGNALR_HUB_URL=https://makemyfree.duckdns.org
          EXPO_PUBLIC_SHOW_TEST_OTP=false
          EXPO_PUBLIC_ENABLE_LOGS=false
          EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN=${{ secrets.EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN }}
          EXPO_PUBLIC_RAZORPAY_KEY_ID=${{ secrets.EXPO_PUBLIC_RAZORPAY_KEY_ID }}
          EOF

      - name: Generate Native Android Project
        run: npx expo prebuild --platform android --clean
        env:
          EXPO_PUBLIC_ENV: prod
          EXPO_PUBLIC_API_BASE_URL: https://makemyfree.duckdns.org/api
          EXPO_PUBLIC_SIGNALR_HUB_URL: https://makemyfree.duckdns.org
          EXPO_PUBLIC_SHOW_TEST_OTP: "false"
          EXPO_PUBLIC_ENABLE_LOGS: "false"

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Release APK & Dev Client APK
        run: |
          cd android
          ./gradlew assembleRelease assembleDebug --no-daemon
        env:
          EXPO_PUBLIC_ENV: prod
          EXPO_PUBLIC_API_BASE_URL: https://makemyfree.duckdns.org/api
          EXPO_PUBLIC_SIGNALR_HUB_URL: https://makemyfree.duckdns.org
          EXPO_PUBLIC_SHOW_TEST_OTP: "false"
          EXPO_PUBLIC_ENABLE_LOGS: "false"

      - name: Rename Dev Client APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk zupify-dev-client.apk || true
          cp android/app/build/outputs/apk/release/app-release.apk zupify-release.apk || true

      - name: Get Version From app.json
        id: get_version
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          SHORT_SHA=$(echo $GITHUB_SHA | cut -c1-7)
          echo "tag_name=v${VERSION}-${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release with Updated APKs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.tag_name }}
          name: "Zupify Release ${{ steps.get_version.outputs.tag_name }}"
          body: |
            ### 🚀 Zupify Automated Build
            - **Production Release APK:** `zupify-release.apk` (Standalone standalone app)
            - **Expo Dev Client APK:** `zupify-dev-client.apk` (Install on phone for live instant hot reload via Metro / `npx expo start`)
          files: |
            zupify-release.apk
            zupify-dev-client.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
